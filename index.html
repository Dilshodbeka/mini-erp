<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aliya ERP v0.5</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--txt:#17221b;--muted:#718078;--line:#dfe5e1;--green:#1f8f55;--yellow:#f1c84b;--red:#b9382c;--blue:#2e6baa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px Arial,sans-serif}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#14211a;color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}.logo{font-size:23px;font-weight:800;padding:4px 9px 18px}.logo b{color:var(--yellow)}.nav button{display:block;width:100%;margin:4px 0;border:0;border-radius:9px;padding:11px;background:transparent;color:#cad5cd;text-align:left}.nav button.active,.nav button:hover{background:#23342a;color:#fff}.side small{position:absolute;bottom:18px;left:18px;right:18px;color:#93a39a;font-size:11px;line-height:1.5}.main{max-width:1600px;width:100%;padding:20px;margin:auto}.top{display:flex;gap:10px;align-items:center;margin-bottom:16px}.search{display:flex;gap:8px;flex:1;position:relative}.search input{width:100%;max-width:700px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 13px}.btn{border:0;border-radius:9px;padding:10px 14px}.primary{background:var(--green);color:#fff}.secondary{background:#edf2ee}.info{background:#e9f1fb;color:#255e98}.warn{background:#fff4ce;color:#7f6500}.danger{background:#fdecea;color:var(--red)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px}.stat .l{font-size:11px;color:var(--muted)}.stat .v{font-size:23px;font-weight:800;margin-top:6px}.card{margin-bottom:15px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{margin:0 0 10px;font-size:18px}.actions{display:flex;gap:7px;flex-wrap:wrap}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:11px;color:var(--muted)}.table td{font-size:13px}.badge{padding:4px 7px;border-radius:99px;font-size:10px;font-weight:700;background:#edf2ee}.green{background:#e2f4e8;color:#187344}.yellow{background:#fff3cf;color:#846800}.blue{background:#e8f0fb;color:#245d98}.red{background:#fdecea;color:#a63127}.debt{color:#b8491d}.credit{color:#197544}.cols{display:grid;grid-template-columns:1.15fr .85fr;gap:15px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;color:var(--muted)}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff}.field textarea{min-height:70px}.sub{border:1px solid var(--line);border-radius:11px;padding:12px;margin-top:12px}.service,.material,.fitting,.product{display:grid;grid-template-columns:1.4fr .6fr .65fr .8fr .85fr auto;gap:6px;align-items:end;margin:7px 0}.material,.fitting{grid-template-columns:1.2fr .55fr .6fr .7fr .75fr .8fr auto}.product{grid-template-columns:1.2fr .9fr .6fr .75fr auto}.notice{background:#f7faf8;padding:9px 11px;border-radius:8px;font-size:12px;color:#5f6e65}.empty{text-align:center;padding:30px;color:var(--muted)}.modal{position:fixed;inset:0;background:#08100b77;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modalbox{width:min(1050px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:14px;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#edf2ee;border-radius:8px;padding:7px}.results{position:absolute;top:47px;left:0;width:min(700px,100%);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 25px #0001;z-index:25;overflow:hidden}.result{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}.result:hover{background:#f5f8f6}.print{background:#fff;max-width:900px;margin:auto;padding:25px}.print h1{font-size:23px;margin:0}.print-head{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:11px;margin-bottom:16px}.print-total{text-align:right;font-size:17px;font-weight:800;margin-top:14px}@media(max-width:1050px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side small{display:none}.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}@media(max-width:700px){.main{padding:12px}.top{flex-direction:column}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.service,.material,.fitting,.product{grid-template-columns:1fr 1fr}.head{flex-direction:column;align-items:stretch}}@media print{body{background:#fff}.side,.top,.no-print{display:none!important}.app{display:block}.main{padding:0}.print{max-width:none;padding:0}}
.hidden{display:none!important}.tabs{display:flex;gap:6px;margin:4px 0 12px;overflow:auto}.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 15px;white-space:nowrap}.tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}.tabs span{opacity:.7;font-size:11px;margin-left:4px}.rsearch{width:100%;max-width:420px;margin:10px 0;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
@media(max-width:1050px){.app{display:block}.side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:15;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px #0003}.logo{display:none}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;overflow:visible}.nav button{text-align:center;font-size:12px;padding:11px 4px;margin:0}.main{padding:12px 12px 90px}}
@media screen and (max-width:700px){input,select,textarea{font-size:16px}.top .actions{display:grid;grid-template-columns:1fr 1fr}.search input{max-width:none}.btn{padding:12px 14px}.grid{grid-template-columns:1fr 1fr}.stat .v{font-size:18px}.modal{padding:0;align-items:flex-end}.modalbox{border-radius:16px 16px 0 0;max-height:94vh;padding:14px}.service>.field:first-child,.material>.field:first-child,.fitting>.field:first-child,.product>.field:first-child,.service>.btn,.material>.btn,.fitting>.btn,.product>.btn{grid-column:1/-1}.head .actions{width:100%}.head .actions .btn{flex:1}.table.m,.table.m tbody{display:block}.table.m tr:first-child{display:none}.table.m tr{display:block;border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:6px 10px}.table.m td{display:flex;justify-content:space-between;gap:12px;border:0;padding:5px 0;white-space:normal;text-align:right}.table.m td::before{content:attr(data-l);color:var(--muted);font-size:11px;text-align:left}}
.svg{width:100%;height:auto;display:block}.svg text{font-size:10px;fill:var(--muted)}.svg text.v{fill:var(--txt);font-weight:700}.hb{margin:10px 0}.hl{display:flex;justify-content:space-between;gap:8px;font-size:13px}.ht{height:8px;background:#edf2ee;border-radius:9px;margin-top:5px;overflow:hidden}.ht i{display:block;height:100%;border-radius:9px}.dn{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}.lg span{color:var(--muted)}.dn .lg{flex-direction:column;flex:1;min-width:170px}.asel{border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}@media(max-width:1050px){.nav{grid-template-columns:repeat(5,1fr)!important}.nav button{font-size:11px!important}}</style></head><body>
<div class="app"><aside class="side"><div class="logo">ALIYA <b>ERP</b></div><div class="nav">
<button data-v="dashboard" onclick="view('dashboard')">Главная</button><button data-v="clients" onclick="view('clients')">Клиенты</button><button data-v="orders" onclick="view('orders')">Заказы</button><button data-v="analytics" onclick="view('analytics')">Аналитика</button><button data-v="refs" onclick="view('refs')">Справочник</button></div><small>v0.5 • Производство как услуга<br>Основа под дальнейшее расширение</small></aside>
<main class="main"><div class="top no-print"><div class="search"><input id="q" placeholder="Телефон, клиент, №109/16, услуга..."><button class="btn secondary" onclick="search()">Найти</button><div id="results" class="results hidden"></div></div><div class="actions"><button class="btn secondary" onclick="newClient()">+ Клиент</button><button class="btn primary" onclick="newOrder()">+ Новый заказ</button></div></div>
<section id="dashboard"></section><section id="clients" class="hidden"></section><section id="orders" class="hidden"></section><section id="analytics" class="hidden"></section><section id="refs" class="hidden"></section><section id="client" class="hidden"></section><section id="order" class="hidden"></section><section id="print" class="hidden"></section></main></div><div id="modal" class="hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Вставьте сюда данные проекта Supabase (Project Settings → API). Пусто = работа локально в браузере */
const SB_URL='',SB_KEY='';
let cloud=false;const K='ALIYA_ERP_V02';let db=JSON.parse(localStorage.getItem(K)||'null'),cid=null,oid=null;
const DEF_S=[['Распил / форматка','лист'],['Кромкооблицовка','м.п.'],['Присадка / сверление','точка'],['CNC / Nesting','лист'],['CNC фрезеровка','м.п.'],['Покраска MDF','м²'],['Сборка','шт'],['Конструкторская работа','заказ']];
const DEF_M=[['ЛДСП 16 мм','лист',220000],['ЛДСП 18 мм','лист',260000],['МДФ 16 мм','лист',360000],['МДФ 18 мм','лист',420000],['Кромка ПВХ 0.4–2 мм','м.п.',2500],['Фанера 18 мм','лист',390000],['Материалы покраски','кг',65000]];
if(!db){db={seq:109,clients:[{id:'c1',name:'ООО Детский мир',phone:'+998 90 123 45 67',address:'Ургенч',note:'Постоянный клиент'},{id:'c2',name:'Иван Петров',phone:'+998 91 765 43 21',address:'Хива',note:''}],orders:[{id:'o1',globalNo:109,clientId:'c1',date:'2026-10-03',type:'Услуга',status:'В работе',note:'Распил и кромка клиентского ЛДСП',services:[{name:'Распил / форматка',unit:'лист',qty:12,price:35000},{name:'Кромкооблицовка',unit:'м.п.',qty:86,price:5500}],materials:[{name:'ЛДСП 16 мм',unit:'лист',qty:12,source:'Клиент',price:0},{name:'Кромка ПВХ 0.4–2 мм',unit:'м.п.',qty:86,source:'Наш',price:2500}],products:[],payments:[{date:'2026-10-03',amount:1180000,note:'Предоплата'}]},{id:'o2',globalNo:108,clientId:'c1',date:'2026-08-17',type:'Готовое изделие',status:'Завершён',note:'Шкафы',services:[],materials:[],products:[{name:'Шкаф',size:'2200×900',qty:2,price:4200000,issued:2}],payments:[{date:'2026-08-17',amount:8400000,note:'Оплата'}]}]};save()}
let services=[],mats=[],fits=[];const uid=()=>'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
if(!db.refs){const P={'Распил / форматка':35000,'Кромкооблицовка':5500},SC=['Раскрой','Кромка','Сверловка','CNC','CNC','Покраска','Сборка','Проектирование'];const DEF_F=[['Петля мебельная с доводчиком','шт','Петли'],['Петля накладная','шт','Петли'],['Направляющие шариковые 500 мм','пара','Направляющие'],['Направляющие скрытого монтажа','пара','Направляющие'],['Ручка-скоба','шт','Ручки'],['Газлифт / подъёмник','шт','Подъёмные механизмы'],['Конфирмат 7×50 (100 шт)','упак.','Крепёж'],['Эксцентрик стяжка','шт','Крепёж'],['Шкант 8×30 (100 шт)','упак.','Крепёж'],['Полкодержатель','шт','Крепёж'],['Ножка регулируемая','шт','Опоры']];db.refs={processes:DEF_S.map((x,i)=>({id:uid(),name:x[0],unit:x[1],price:P[x[0]]||0,cat:SC[i]})),materials:DEF_M.map(x=>({id:uid(),name:x[0],unit:x[1],price:x[2],cat:/Кромка/.test(x[0])?'Кромка':/покраск/i.test(x[0])?'Покраска':'Плиты'})),fittings:DEF_F.map(x=>({id:uid(),name:x[0],unit:x[1],price:0,cat:x[2]}))};save()}
db.orders.forEach(o=>{o.fittings=o.fittings||[]});function syncRefs(){services=db.refs.processes.map(x=>[x.name,x.unit,x.price]);mats=db.refs.materials.map(x=>[x.name,x.unit,x.price]);fits=db.refs.fittings.map(x=>[x.name,x.unit,x.price])}syncRefs();
const money=n=>new Intl.NumberFormat('ru-RU').format(Math.round(n||0))+' сум';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const client=id=>db.clients.find(x=>x.id===id);const ordersOf=id=>db.orders.filter(x=>x.clientId===id).sort((a,b)=>a.globalNo-b.globalNo);const svcTotal=o=>(o.services||[]).reduce((s,x)=>s+x.qty*x.price,0);const matTotal=o=>(o.materials||[]).filter(x=>x.source==='Наш').reduce((s,x)=>s+x.qty*x.price,0);const prodTotal=o=>(o.products||[]).reduce((s,x)=>s+x.qty*x.price,0);const total=o=>svcTotal(o)+matTotal(o)+fitTotal(o)+prodTotal(o);const paid=o=>(o.payments||[]).reduce((s,x)=>s+x.amount,0);const bal=id=>ordersOf(id).reduce((s,o)=>s+total(o)-paid(o),0);function save(){if(cloud){queueSync();return}localStorage.setItem(K,JSON.stringify(db))};function ono(o){let i=ordersOf(o.clientId).findIndex(x=>x.globalNo===o.globalNo)+1;return o.globalNo+'/'+i};function cls(s){return s==='Завершён'?'green':s==='В работе'?'blue':s==='Выдан частично'?'yellow':'red'}
function view(v){['dashboard','clients','orders','analytics','refs','client','order','print'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==v));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));({dashboard:dash,clients:renderClients,orders:renderOrders,analytics:renderAnalytics,refs:renderRefs,client:renderClient,order:renderOrder}[v]?.());window.scrollTo(0,0)}
function dash(){let turnover=db.orders.reduce((s,o)=>s+total(o),0),ut=db.orders.reduce((s,o)=>s+svcTotal(o),0),debt=db.clients.reduce((s,c)=>s+Math.max(0,bal(c.id)),0);document.getElementById('dashboard').innerHTML=`<div class="grid"><div class="stat"><div class="l">Клиенты</div><div class="v">${db.clients.length}</div></div><div class="stat"><div class="l">Заказы</div><div class="v">${db.orders.length}</div></div><div class="stat"><div class="l">Оборот</div><div class="v">${money(turnover)}</div></div><div class="stat"><div class="l">Выручка от услуг</div><div class="v">${money(ut)}</div></div></div><div class="cols"><div class="card"><div class="head"><h2>Последние заказы</h2><button class="btn secondary" onclick="view('orders')">Все</button></div>${ordersTable(db.orders.slice().sort((a,b)=>b.globalNo-a.globalNo).slice(0,8))}</div><div class="card"><div class="head"><h2>Клиенты</h2><button class="btn secondary" onclick="view('clients')">Все</button></div>${clientsTable(db.clients)}</div></div><div class="card"><div class="head"><h2>Что теперь умеет система</h2></div><div class="notice">Заказ может быть <b>Услугой</b>, <b>Готовым изделием</b> или <b>Смешанным</b>. Материал в каждой позиции имеет источник <b>Наш</b> или <b>Клиент</b>. Наш материал входит в расчёт, клиентский материал остаётся в спецификации без начисления стоимости. Есть PDF/печать заказа и истории клиента.</div></div>`}
function clientsTable(a){if(!a.length)return '<div class="empty">Нет клиентов</div>';return `<div class="tablewrap"><table class="table"><tr><th>Клиент</th><th>Телефон</th><th>Заказы</th><th>Оборот</th><th>Баланс</th></tr>${a.map(c=>{let os=ordersOf(c.id),t=os.reduce((s,o)=>s+total(o),0),b=bal(c.id);return `<tr onclick="openClient('${c.id}')" style="cursor:pointer"><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${os.length}</td><td>${money(t)}</td><td class="${b>0?'debt':'credit'}"><b>${b>0?'Долг ':'Кредит '}${money(Math.abs(b))}</b></td></tr>`}).join('')}</table></div>`}
function ordersTable(a){if(!a.length)return '<div class="empty">Нет заказов</div>';return `<div class="tablewrap"><table class="table"><tr><th>№</th><th>Тип</th><th>Клиент</th><th>Дата</th><th>Сумма</th><th>Оплата</th><th>Статус</th></tr>${a.map(o=>`<tr onclick="openOrder('${o.id}')" style="cursor:pointer"><td><b>${ono(o)}</b></td><td>${esc(o.type)}</td><td>${esc(client(o.clientId).name)}</td><td>${o.date}</td><td>${money(total(o))}</td><td>${money(paid(o))}</td><td><span class="badge ${cls(o.status)}">${esc(o.status)}</span></td></tr>`).join('')}</table></div>`}
function renderClients(){document.getElementById('clients').innerHTML=`<div class="card"><div class="head"><h2>Клиенты</h2><button class="btn primary" onclick="newClient()">+ Создать клиента</button></div>${clientsTable(db.clients.slice().sort((a,b)=>a.name.localeCompare(b.name)))}</div>`}
function renderOrders(){document.getElementById('orders').innerHTML=`<div class="card"><div class="head"><h2>Заказы</h2><button class="btn primary" onclick="newOrder()">+ Новый заказ</button></div>${ordersTable(db.orders.slice().sort((a,b)=>b.globalNo-a.globalNo))}</div>`}
function openClient(id){cid=id;view('client')};function openOrder(id){oid=id;view('order')}
function renderClient(){let c=client(cid),os=ordersOf(cid),b=bal(cid),t=os.reduce((s,o)=>s+total(o),0);document.getElementById('client').innerHTML=`<div class="card"><div class="head"><div><div style="font-size:22px;font-weight:800">${esc(c.name)}</div><div style="color:var(--muted);margin-top:4px">${esc(c.phone)} · ${esc(c.address||'')}</div></div><div class="actions"><button class="btn secondary" onclick="newClient(client('${c.id}'))">Редактировать</button><button class="btn info" onclick="clientPdf('${c.id}')">PDF история</button><button class="btn primary" onclick="newOrder('${c.id}')">+ Новый заказ</button></div></div><div class="grid" style="margin-top:14px"><div class="stat"><div class="l">Заказов</div><div class="v">${os.length}</div></div><div class="stat"><div class="l">Оборот</div><div class="v">${money(t)}</div></div><div class="stat"><div class="l">Оплачено</div><div class="v">${money(os.reduce((s,o)=>s+paid(o),0))}</div></div><div class="stat"><div class="l">Баланс</div><div class="v ${b>0?'debt':'credit'}">${b>0?'Долг ':'Кредит '}${money(Math.abs(b))}</div></div></div></div><div class="card"><div class="head"><h2>История заказов клиента</h2><button class="btn primary" onclick="newOrder('${cid}')">+ Новый заказ</button></div>${ordersTable(os.slice().reverse())}</div>`}
function renderOrder(){let o=db.orders.find(x=>x.id===oid),c=client(o.clientId),bt=total(o)-paid(o);document.getElementById('order').innerHTML=`<div class="card"><div class="head"><div><div style="font-size:22px;font-weight:800">Заказ №${ono(o)}</div><div style="color:var(--muted);margin-top:4px">${esc(c.name)} · ${esc(c.phone)} · ${o.date} · ${esc(o.type)}</div></div><div class="actions"><button class="btn info" onclick="orderPdf('${o.id}')">Скачать PDF</button><button class="btn info" onclick="printOrder('${o.id}')">Печать</button><button class="btn secondary" onclick="payment('${o.id}')">+ Оплата</button><button class="btn secondary" onclick="issue('${o.id}')">Выдача</button><button class="btn warn" onclick="editOrder('${o.id}')">Изменить</button></div></div><div class="notice" style="margin-top:11px">${esc(o.note||'Без комментария')}</div></div><div class="cols"><div><div class="card"><div class="head"><h2>Услуги / работы</h2></div>${servicesTable(o)}</div><div class="card"><h2>Материалы</h2>${materialsTable(o)}</div>${(o.fittings||[]).length?`<div class="card"><h2>Фурнитура</h2>${fittingsTable(o)}</div>`:''}${(o.products||[]).length?`<div class="card"><h2>Готовые изделия</h2>${productsTable(o)}</div>`:''}</div><div><div class="card"><h2>Расчёт</h2><div class="tablewrap"><table class="table"><tr><td>Услуги</td><td><b>${money(svcTotal(o))}</b></td></tr><tr><td>Наш материал</td><td><b>${money(matTotal(o))}</b></td></tr><tr><td>Фурнитура</td><td><b>${money(fitTotal(o))}</b></td></tr><tr><td>Готовые изделия</td><td><b>${money(prodTotal(o))}</b></td></tr><tr><th>ИТОГО</th><th>${money(total(o))}</th></tr><tr><td>Оплачено</td><td>${money(paid(o))}</td></tr><tr><td>Остаток</td><td class="${bt>0?'debt':'credit'}"><b>${money(Math.abs(bt))}</b></td></tr></table></div></div><div class="card"><h2>Оплаты</h2>${payments(o)}</div></div></div>`}
function servicesTable(o){return (o.services||[]).length?`<table class="table"><tr><th>Работа</th><th>Ед.</th><th>Кол-во</th><th>Цена</th><th>Сумма</th></tr>${o.services.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.unit}</td><td>${x.qty}</td><td>${money(x.price)}</td><td><b>${money(x.qty*x.price)}</b></td></tr>`).join('')}</table>`:'<div class="empty">Услуг нет</div>'}
function materialsTable(o){return (o.materials||[]).length?`<table class="table"><tr><th>Материал</th><th>Ед.</th><th>Кол-во</th><th>Источник</th><th>Цена</th><th>Сумма</th></tr>${o.materials.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.unit}</td><td>${x.qty}</td><td><span class="badge ${x.source==='Наш'?'green':'blue'}">${x.source}</span></td><td>${x.source==='Наш'?money(x.price):'—'}</td><td>${x.source==='Наш'?money(x.qty*x.price):'0 сум'}</td></tr>`).join('')}</table>`:'<div class="empty">Материалы не указаны</div>'}
function productsTable(o){return `<table class="table"><tr><th>Изделие</th><th>Размер</th><th>Кол-во</th><th>Цена</th><th>Выдано</th></tr>${(o.products||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.size||'')}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${x.issued||0}/${x.qty}</td></tr>`).join('')}</table>`}
function payments(o){return (o.payments||[]).length?`<table class="table"><tr><th>Дата</th><th>Сумма</th><th>Комментарий</th></tr>${o.payments.map(x=>`<tr><td>${x.date}</td><td><b>${money(x.amount)}</b></td><td>${esc(x.note||'')}</td></tr>`).join('')}</table>`:'<div class="empty">Оплат нет</div>'}
function modal(h){let m=document.getElementById('modal');m.className='modal';m.innerHTML='<div class="modalbox">'+h+'</div>'}function closeModal(){let m=document.getElementById('modal');m.className='hidden';m.innerHTML=''}
function newClient(d={}){modal(`<div class="modalhead"><h2>${d.id?'Редактировать клиента':'Новый клиент'}</h2><button class="close" onclick="closeModal()">✕</button></div><div class="formgrid" style="margin-top:14px"><div class="field"><label>Имя / компания *</label><input id="cn" value="${esc(d.name||'')}"></div><div class="field"><label>Телефон *</label><input id="cp" value="${esc(d.phone||'')}"></div><div class="field"><label>Адрес</label><input id="ca" value="${esc(d.address||'')}"></div><div class="field"><label>Примечание</label><input id="cm" value="${esc(d.note||'')}"></div></div><div class="actions" style="margin-top:15px"><button class="btn secondary" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="saveClient('${d.id||''}')">Сохранить</button></div>`)}
function saveClient(id){let name=cn.value.trim(),phone=cp.value.trim();if(!name||!phone)return alert('Имя/компания и телефон обязательны');let d={name,phone,address:ca.value.trim(),note:cm.value.trim()};if(id)Object.assign(client(id),d);else db.clients.push({id:'c'+Date.now(),...d});save();closeModal();view(id?'client':'clients')}
function newOrder(clientId=''){modal(`<div class="modalhead"><h2>Новый заказ</h2><button class="close" onclick="closeModal()">✕</button></div><div class="formgrid" style="margin-top:14px"><div class="field"><label>Клиент *</label><select id="oc">${db.clients.map(c=>`<option value="${c.id}" ${c.id===clientId?'selected':''}>${esc(c.name)} — ${esc(c.phone)}</option>`).join('')}</select></div><div class="field"><label>Тип</label><select id="ot"><option>Услуга</option><option>Готовое изделие</option><option>Смешанный</option></select></div><div class="field"><label>Дата</label><input id="od" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Статус</label><select id="os"><option>Новый</option><option>В работе</option><option>Выдан частично</option><option>Завершён</option></select></div><div class="field" style="grid-column:1/-1"><label>Что нужно сделать</label><textarea id="on"></textarea></div></div><div class="sub"><div class="head"><h3>Услуги</h3><button class="btn secondary" onclick="addService()">+ Услуга</button></div><div id="sl"></div></div><div class="sub"><div class="head"><h3>Материалы</h3><button class="btn secondary" onclick="addMaterial()">+ Материал</button></div><div class="notice">Выберите источник: <b>Наш</b> — стоимость входит в счёт; <b>Клиент</b> — материал только фиксируется в спецификации.</div><div id="ml"></div></div><div class="sub"><div class="head"><h3>Фурнитура</h3><button class="btn secondary" onclick="addFitting()">+ Фурнитура</button></div><div id="fl"></div></div><div class="sub"><div class="head"><h3>Готовые изделия</h3><button class="btn secondary" onclick="addProduct()">+ Изделие</button></div><div id="pl"></div></div><div class="actions" style="margin-top:16px"><button class="btn secondary" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="saveOrder()">Создать заказ</button></div>`);addService();addMaterial()}
function addService(d={}){let r=document.createElement('div');r.className='service';r.innerHTML=`<div class="field"><label>Услуга</label><select class="sn">${(d.name&&!services.some(x=>x[0]===d.name)?`<option selected data-u="${esc(d.unit)}" data-p="${d.price||0}">${esc(d.name)}</option>`:'')}${services.map(x=>`<option ${x[0]===d.name?'selected':''} data-u="${x[1]}" data-p="${x[2]}">${esc(x[0])}</option>`).join('')}</select></div><div class="field"><label>Ед.</label><input class="su" readonly value="${d.unit||services[0][1]}"></div><div class="field"><label>Кол-во</label><input class="sq" type="number" min="0" value="${d.qty||1}"></div><div class="field"><label>Цена</label><input class="sp" type="number" min="0" value="${d.price??services[0][2]}"></div><div class="field"><label>Сумма</label><input class="st" readonly value="0"></div><button class="btn danger" onclick="this.parentElement.remove()">✕</button>`;document.getElementById('sl').appendChild(r);r.querySelector('.sn').onchange=()=>{r.querySelector('.su').value=r.querySelector('.sn').selectedOptions[0].dataset.u;r.querySelector('.sp').value=r.querySelector('.sn').selectedOptions[0].dataset.p;calcLines()};r.querySelectorAll('input').forEach(x=>x.oninput=calcLines);calcLines()}
function addMaterial(d={}){let r=document.createElement('div');r.className='material';r.innerHTML=`<div class="field"><label>Материал</label><select class="mn">${(d.name&&!mats.some(x=>x[0]===d.name)?`<option selected data-u="${esc(d.unit)}" data-p="${d.price||0}">${esc(d.name)}</option>`:'')}${mats.map(x=>`<option data-u="${x[1]}" data-p="${x[2]}" ${x[0]===d.name?'selected':''}>${esc(x[0])}</option>`).join('')}</select></div><div class="field"><label>Ед.</label><input class="mu" readonly value="${d.unit||mats[0][1]}"></div><div class="field"><label>Кол-во</label><input class="mq" type="number" min="0" value="${d.qty||1}"></div><div class="field"><label>Источник</label><select class="ms"><option ${!d.source||d.source==='Наш'?'selected':''}>Наш</option><option ${d.source==='Клиент'?'selected':''}>Клиент</option></select></div><div class="field"><label>Цена</label><input class="mp" type="number" min="0" value="${d.price??mats[0][2]}"></div><div class="field"><label>Сумма</label><input class="mt" readonly value="0"></div><button class="btn danger" onclick="this.parentElement.remove()">✕</button>`;document.getElementById('ml').appendChild(r);let sel=r.querySelector('.mn'),src=r.querySelector('.ms'),p=r.querySelector('.mp');sel.onchange=()=>{let o=sel.selectedOptions[0];r.querySelector('.mu').value=o.dataset.u;p.value=src.value==='Клиент'?0:o.dataset.p;calcLines()};src.onchange=()=>{p.disabled=src.value==='Клиент';if(src.value==='Клиент')p.value=0;else if(+p.value===0)p.value=sel.selectedOptions[0].dataset.p;calcLines()};src.onchange();r.querySelectorAll('input').forEach(x=>x.oninput=calcLines);calcLines()}
function addFitting(d={}){let r=document.createElement('div');r.className='fitting';r.innerHTML=`<div class="field"><label>Фурнитура</label><select class="fn">${(d.name&&!fits.some(x=>x[0]===d.name)?`<option selected data-u="${esc(d.unit)}" data-p="${d.price||0}">${esc(d.name)}</option>`:'')}${fits.map(x=>`<option data-u="${x[1]}" data-p="${x[2]}" ${x[0]===d.name?'selected':''}>${esc(x[0])}</option>`).join('')}</select></div><div class="field"><label>Ед.</label><input class="fu" readonly value="${d.unit||fits[0][1]}"></div><div class="field"><label>Кол-во</label><input class="fq" type="number" min="0" value="${d.qty||1}"></div><div class="field"><label>Источник</label><select class="fs"><option ${!d.source||d.source==='Наш'?'selected':''}>Наш</option><option ${d.source==='Клиент'?'selected':''}>Клиент</option></select></div><div class="field"><label>Цена</label><input class="fp" type="number" min="0" value="${d.price??fits[0][2]}"></div><div class="field"><label>Сумма</label><input class="ft" readonly value="0"></div><button class="btn danger" onclick="this.parentElement.remove()">✕</button>`;document.getElementById('fl').appendChild(r);let sel=r.querySelector('.fn'),src=r.querySelector('.fs'),p=r.querySelector('.fp');sel.onchange=()=>{let o=sel.selectedOptions[0];r.querySelector('.fu').value=o.dataset.u;p.value=src.value==='Клиент'?0:o.dataset.p;calcLines()};src.onchange=()=>{p.disabled=src.value==='Клиент';if(src.value==='Клиент')p.value=0;else if(+p.value===0)p.value=sel.selectedOptions[0].dataset.p;calcLines()};src.onchange();r.querySelectorAll('input').forEach(x=>x.oninput=calcLines);calcLines()}
function addProduct(d={}){let r=document.createElement('div');r.className='product';r.innerHTML=`<div class="field"><label>Изделие</label><input class="pn" value="${esc(d.name||'')}"></div><div class="field"><label>Размер</label><input class="psz" value="${esc(d.size||'')}"></div><div class="field"><label>Кол-во</label><input class="pq" type="number" min="1" value="${d.qty||1}"></div><div class="field"><label>Цена</label><input class="pp" type="number" min="0" value="${d.price||0}"></div><button class="btn danger" onclick="this.parentElement.remove()">✕</button>`;document.getElementById('pl').appendChild(r)}
function calcLines(){document.querySelectorAll('.service').forEach(r=>r.querySelector('.st').value=money((+r.querySelector('.sq').value||0)*(+r.querySelector('.sp').value||0)));[['material','m'],['fitting','f']].forEach(([c,k])=>document.querySelectorAll('.'+c).forEach(r=>r.querySelector('.'+k+'t').value=r.querySelector('.'+k+'s').value==='Наш'?money((+r.querySelector('.'+k+'q').value||0)*(+r.querySelector('.'+k+'p').value||0)):'0 сум'))}
function saveOrder(){let o={id:'o'+Date.now(),globalNo:++db.seq,clientId:oc.value,date:od.value,type:ot.value,status:os.value,note:on.value.trim(),services:[],materials:[],fittings:[],products:[],payments:[]};document.querySelectorAll('#sl .service').forEach(r=>o.services.push({name:r.querySelector('.sn').value,unit:r.querySelector('.su').value,qty:+r.querySelector('.sq').value||0,price:+r.querySelector('.sp').value||0}));document.querySelectorAll('#ml .material').forEach(r=>o.materials.push({name:r.querySelector('.mn').value,unit:r.querySelector('.mu').value,qty:+r.querySelector('.mq').value||0,source:r.querySelector('.ms').value,price:+r.querySelector('.mp').value||0}));o.fittings=[...document.querySelectorAll('#fl .fitting')].map(r=>({name:r.querySelector('.fn').value,unit:r.querySelector('.fu').value,qty:+r.querySelector('.fq').value||0,source:r.querySelector('.fs').value,price:+r.querySelector('.fp').value||0}));document.querySelectorAll('#pl .product').forEach(r=>o.products.push({name:r.querySelector('.pn').value.trim()||'Без названия',size:r.querySelector('.psz').value,qty:+r.querySelector('.pq').value||1,price:+r.querySelector('.pp').value||0,issued:0}));db.orders.push(o);save();closeModal();oid=o.id;view('order')}
function payment(id){modal(`<div class="modalhead"><h2>Оплата</h2><button class="close" onclick="closeModal()">✕</button></div><div class="formgrid" style="margin-top:14px"><div class="field"><label>Сумма</label><input id="pa" type="number"></div><div class="field"><label>Дата</label><input id="pd" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Комментарий</label><input id="pm" placeholder="Наличные / перевод"></div></div><div class="actions" style="margin-top:14px"><button class="btn secondary" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="savePay('${id}')">Сохранить</button></div>`)}
function savePay(id){let a=+pa.value||0;if(a<=0)return alert('Введите сумму');db.orders.find(o=>o.id===id).payments.push({date:pd.value,amount:a,note:pm.value});save();closeModal();renderOrder()}
function issue(id){let o=db.orders.find(x=>x.id===id);if(!o.products.length)return alert('Готовых изделий в заказе нет');modal(`<div class="modalhead"><h2>Выдача №${ono(o)}</h2><button class="close" onclick="closeModal()">✕</button></div>${o.products.map((x,i)=>`<div class="field" style="margin:9px 0"><label>${esc(x.name)} — ${x.issued||0}/${x.qty}</label><input id="iq${i}" type="number" min="0" max="${x.qty-(x.issued||0)}" value="0"></div>`).join('')}<div class="actions" style="margin-top:15px"><button class="btn secondary" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="saveIssue('${id}')">Записать</button></div>`)}
function saveIssue(id){let o=db.orders.find(x=>x.id===id);o.products.forEach((x,i)=>x.issued=(x.issued||0)+(+document.getElementById('iq'+i).value||0));o.status=o.products.every(x=>x.issued>=x.qty)?'Завершён':'Выдан частично';save();closeModal();renderOrder()}
function editOrder(id){let o=db.orders.find(x=>x.id===id);modal(`<div class="modalhead"><h2>Изменить заказ №${ono(o)}</h2><button class="close" onclick="closeModal()">✕</button></div><div class="formgrid" style="margin-top:14px"><div class="field"><label>Дата</label><input id="ed" type="date" value="${o.date}"></div><div class="field"><label>Статус</label><select id="es">${['Новый','В работе','Выдан частично','Завершён'].map(x=>`<option ${x===o.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Тип</label><select id="et">${['Услуга','Готовое изделие','Смешанный'].map(x=>`<option ${x===o.type?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Комментарий</label><input id="en" value="${esc(o.note||'')}"></div></div><div class="sub"><div class="head"><h3>Услуги</h3><button class="btn secondary" onclick="addService()">+ Услуга</button></div><div id="sl"></div></div><div class="sub"><div class="head"><h3>Материалы</h3><button class="btn secondary" onclick="addMaterial()">+ Материал</button></div><div id="ml"></div></div><div class="sub"><div class="head"><h3>Фурнитура</h3><button class="btn secondary" onclick="addFitting()">+ Фурнитура</button></div><div id="fl"></div></div><div class="sub"><div class="head"><h3>Изделия</h3><button class="btn secondary" onclick="addProduct()">+ Изделие</button></div><div id="pl"></div></div><div class="actions" style="margin-top:15px"><button class="btn secondary" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="saveEdit('${id}')">Сохранить</button></div>`);(o.services||[]).forEach(addService);(o.materials||[]).forEach(addMaterial);(o.fittings||[]).forEach(addFitting);(o.products||[]).forEach(addProduct);if(!o.services?.length)addService()}
function saveEdit(id){let o=db.orders.find(x=>x.id===id);o.date=ed.value;o.status=es.value;o.type=et.value;o.note=en.value;o.services=[...document.querySelectorAll('#sl .service')].map(r=>({name:r.querySelector('.sn').value,unit:r.querySelector('.su').value,qty:+r.querySelector('.sq').value||0,price:+r.querySelector('.sp').value||0}));o.materials=[...document.querySelectorAll('#ml .material')].map(r=>({name:r.querySelector('.mn').value,unit:r.querySelector('.mu').value,qty:+r.querySelector('.mq').value||0,source:r.querySelector('.ms').value,price:+r.querySelector('.mp').value||0}));o.fittings=[...document.querySelectorAll('#fl .fitting')].map(r=>({name:r.querySelector('.fn').value,unit:r.querySelector('.fu').value,qty:+r.querySelector('.fq').value||0,source:r.querySelector('.fs').value,price:+r.querySelector('.fp').value||0}));let old=o.products||[];o.products=[...document.querySelectorAll('#pl .product')].map(r=>{let n=r.querySelector('.pn').value.trim()||'Без названия',x=old.find(z=>z.name===n);return{name:n,size:r.querySelector('.psz').value,qty:+r.querySelector('.pq').value||1,price:+r.querySelector('.pp').value||0,issued:x?.issued||0}});save();closeModal();renderOrder()}
function search(){let q=document.getElementById('q').value.toLowerCase().trim(),r=document.getElementById('results');if(!q){r.classList.add('hidden');return}let out=[];db.clients.filter(c=>c.name.toLowerCase().includes(q)||c.phone.toLowerCase().includes(q)).slice(0,6).forEach(c=>out.push(`<div class="result" onclick="openClient('${c.id}');hideR()"><b>Клиент:</b> ${esc(c.name)}<br><span style="color:var(--muted)">${esc(c.phone)}</span></div>`));db.orders.filter(o=>ono(o).toLowerCase().includes(q)||String(o.globalNo)===q).slice(0,6).forEach(o=>out.push(`<div class="result" onclick="openOrder('${o.id}');hideR()"><b>Заказ:</b> ${ono(o)} · ${esc(client(o.clientId).name)} · ${money(total(o))}</div>`));[['processes','Процесс'],['materials','Материал'],['fittings','Фурнитура']].forEach(([t,l])=>db.refs[t].filter(x=>(x.name+' '+(x.cat||'')).toLowerCase().includes(q)).slice(0,5).forEach(x=>out.push(`<div class="result" onclick="rtab='${t}';rq='';view('refs');hideR()"><b>${l}:</b> ${esc(x.name)} · ${money(x.price)}</div>`)));r.innerHTML=out.length?out.join(''):'<div class="result">Ничего не найдено</div>';r.classList.remove('hidden')};function hideR(){document.getElementById('results').classList.add('hidden')};document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});document.addEventListener('click',e=>{if(!e.target.closest('.search'))hideR()});
function pdfSheet(html){document.getElementById('print').innerHTML=`<div class="print"><div class="no-print actions" style="margin-bottom:13px"><button class="btn secondary" onclick="view(oid?'order':'client')">← Назад</button><button class="btn primary" onclick="window.print()">Печать / Сохранить как PDF</button></div>${html}</div>`;view('print')}
function orderPdf(id){let o=db.orders.find(x=>x.id===id),c=client(o.clientId);pdfSheet(`<div class="print-head"><div><h1>ALIYA MEBEL</h1><div>Производство мебели и услуги станков</div></div><div><b>Заказ №${ono(o)}</b><br>${o.date}<br>${esc(o.type)}</div></div><p><b>Клиент:</b> ${esc(c.name)}<br><b>Телефон:</b> ${esc(c.phone)}<br><b>Адрес:</b> ${esc(c.address||'')}</p><h3>Услуги</h3>${servicesTable(o)}<h3>Материалы</h3>${materialsTable(o)}${(o.fittings||[]).length?'<h3>Фурнитура</h3>'+fittingsTable(o):''}${o.products.length?'<h3>Готовые изделия</h3>'+productsTable(o):''}<div class="print-total">ИТОГО: ${money(total(o))}<br><small>Оплачено: ${money(paid(o))}<br>Остаток: ${money(Math.abs(total(o)-paid(o)))}</small></div><p style="margin-top:25px;color:#666">Документ для отправки клиенту / печати.</p>`)}
function clientPdf(id){let c=client(id),os=ordersOf(id);pdfSheet(`<div class="print-head"><div><h1>ALIYA MEBEL</h1><div>История клиента</div></div><div>${new Date().toLocaleDateString('ru-RU')}</div></div><h2>${esc(c.name)}</h2><p>${esc(c.phone)} · ${esc(c.address||'')}</p>${ordersTable(os.slice().reverse())}<div class="print-total">Оборот: ${money(os.reduce((s,o)=>s+total(o),0))}<br>Баланс: ${money(Math.abs(bal(id)))}</div>`)}
function printOrder(id){orderPdf(id);setTimeout(()=>window.print(),200)}
const RT={processes:'Процессы',materials:'Материалы',fittings:'Фурнитура'};const UNITS=['лист','м.п.','м²','шт','пара','комплект','упак.','кг','точка','заказ'];let rtab='processes',rq='';

function fittingsTable(o){return materialsTable({materials:o.fittings}).replace('Материал','Фурнитура')}
function renderRefs(){document.getElementById('refs').innerHTML=`<div class="card"><div class="head"><h2>Справочник</h2><button class="btn primary" onclick="refForm('${rtab}')">+ Добавить</button></div><div class="tabs">${Object.keys(RT).map(t=>`<button class="${t===rtab?'on':''}" onclick="rtab='${t}';rq='';renderRefs()">${RT[t]}<span>${db.refs[t].length}</span></button>`).join('')}</div><div class="notice">Цены отсюда подставляются в новый заказ автоматически, в заказе их можно изменить. Уже созданные заказы при правке справочника не меняются.${rtab==='fittings'?' Для фурнитуры задайте реальные цены — сейчас стоят нули.':''}</div><input class="rsearch" placeholder="Поиск по названию или категории" value="${esc(rq)}" oninput="rq=this.value;document.getElementById('rtbl').innerHTML=refTable()"><div id="rtbl" class="tablewrap">${refTable()}</div></div>`}
function refTable(){const q=rq.toLowerCase(),L=db.refs[rtab].filter(x=>(x.name+' '+(x.cat||'')).toLowerCase().includes(q));if(!L.length)return '<div class="empty">Ничего не найдено</div>';return `<table class="table"><tr><th>Название</th><th>Категория</th><th>Ед.</th><th>Цена</th><th></th></tr>${L.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.cat||'—')}</td><td>${esc(x.unit)}</td><td>${x.price>0?money(x.price):'<span class="badge yellow">не задана</span>'}</td><td><div class="actions"><button class="btn secondary" onclick="refForm('${rtab}','${x.id}')">Изменить</button><button class="btn danger" onclick="delRef('${rtab}','${x.id}')">✕</button></div></td></tr>`).join('')}</table>`}
function refForm(t,id){const d=id?db.refs[t].find(x=>x.id===id):{},cats=[...new Set(db.refs[t].map(x=>x.cat).filter(Boolean))],us=[...new Set([...UNITS,d.unit].filter(Boolean))],du=d.unit||(t==='fittings'?'шт':'лист');modal(`<div class="modalhead"><h2>${id?'Изменить':'Добавить'}: ${RT[t]}</h2><button class="close" onclick="closeModal()">✕</button></div><div class="formgrid" style="margin-top:14px"><div class="field"><label>Название *</label><input id="rf_n" value="${esc(d.name||'')}"></div><div class="field"><label>Категория</label><input id="rf_c" list="rf_cl" value="${esc(d.cat||'')}"><datalist id="rf_cl">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div><div class="field"><label>Единица</label><select id="rf_u">${us.map(u=>`<option ${u===du?'selected':''}>${esc(u)}</option>`).join('')}</select></div><div class="field"><label>Цена по умолчанию, сум</label><input id="rf_p" type="number" min="0" value="${d.price||0}"></div></div><div class="actions" style="margin-top:15px"><button class="btn secondary" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="saveRef('${t}','${id||''}')">Сохранить</button></div>`)}
function saveRef(t,id){const g=x=>document.getElementById(x).value.trim(),name=g('rf_n');if(!name)return alert('Укажите название');if(db.refs[t].some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase()))return alert('Такое название уже есть в справочнике');const d={name,cat:g('rf_c'),unit:g('rf_u'),price:Math.max(0,+g('rf_p')||0)};if(id)Object.assign(db.refs[t].find(x=>x.id===id),d);else db.refs[t].push({id:uid(),...d});save();syncRefs();closeModal();renderRefs()}
function delRef(t,id){if(db.refs[t].length<=1)return alert('В справочнике должна остаться хотя бы одна позиция');if(!confirm('Удалить позицию? Созданные заказы не изменятся.'))return;db.refs[t]=db.refs[t].filter(x=>x.id!==id);save();syncRefs();renderRefs()}
function mobLabels(){document.querySelectorAll('.main table.table:not(.m)').forEach(t=>{const r=t.rows;if(!r.length)return;const h=[...r[0].cells];if(!h.every(c=>c.tagName==='TH'))return;t.classList.add('m');const n=h.map(c=>c.textContent.trim());[...r].slice(1).forEach(tr=>[...tr.cells].forEach((c,i)=>c.dataset.l=n[i]||''))})}
new MutationObserver(mobLabels).observe(document.querySelector('.main'),{childList:true,subtree:true});
const COL=['#1f8f55','#2e6baa','#f1c84b','#b9382c','#7a5fb0','#2aa7a0'],MN=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];let ap=6;
const short=n=>n>=1e6?(n/1e6).toFixed(1).replace('.0','')+' млн':n>=1e3?Math.round(n/1e3)+' тыс':String(Math.round(n));
function hbars(a,f=money){const m=Math.max(...a.map(x=>x.v),1);return a.length?a.map((x,i)=>`<div class="hb"><div class="hl"><span>${esc(x.l)}</span><b>${f(x.v)}</b></div><div class="ht"><i style="width:${Math.max(2,x.v/m*100)}%;background:${x.c||COL[i%6]}"></i></div></div>`).join(''):'<div class="empty">Нет данных</div>'}
function stack(lb,se){const W=420,H=230,n=lb.length,tot=lb.map((_,i)=>se.reduce((s,x)=>s+x.v[i],0)),mx=Math.max(...tot,1),bw=W/n;if(!tot.some(x=>x))return '<div class="empty">Нет данных за период</div>';return `<svg viewBox="0 0 ${W} ${H}" class="svg"><line x1="0" x2="${W}" y1="${H-24}" y2="${H-24}" stroke="#dfe5e1"/>${lb.map((m,i)=>{let y=H-24;const cx=i*bw+bw/2;return se.map(x=>{const h=x.v[i]/mx*(H-60);y-=h;return h>0?`<rect x="${i*bw+bw*.18}" y="${y}" width="${bw*.64}" height="${h}" fill="${x.c}" rx="2"/>`:''}).join('')+`<text x="${cx}" y="${H-8}" text-anchor="middle">${m}</text>`+(tot[i]?`<text class="v" x="${cx}" y="${y-4}" text-anchor="middle">${short(tot[i])}</text>`:'')}).join('')}</svg>`}
function donut(a){const t=a.reduce((s,x)=>s+x.v,0);if(!t)return '<div class="empty">Нет данных</div>';let o=0;const r=55,C=2*Math.PI*r;return `<div class="dn"><svg viewBox="0 0 140 140" width="150" height="150"><g transform="rotate(-90 70 70)" fill="none" stroke-width="26">${a.map((x,i)=>{const l=x.v/t*C,e=`<circle cx="70" cy="70" r="${r}" stroke="${COL[i%6]}" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}"/>`;o+=l;return e}).join('')}</g></svg><div class="lg">${a.map((x,i)=>`<div><i style="background:${COL[i%6]}"></i>${esc(x.l)} <b>${Math.round(x.v/t*100)}%</b> <span>${money(x.v)}</span></div>`).join('')}</div></div>`}
function renderAnalytics(){const ym=d=>{d=new Date(d);return d.getFullYear()*12+d.getMonth()},cur=ym(new Date());let n=ap;if(!n){const ds=db.orders.map(o=>o.date).concat(db.orders.flatMap(o=>(o.payments||[]).map(p=>p.date)));n=ds.length?Math.min(24,cur-Math.min(...ds.map(ym))+1):6}
const keys=[...Array(n)].map((_,i)=>cur-n+1+i),lb=keys.map(k=>MN[k%12]+' '+String(Math.floor(k/12)).slice(2)),inP=d=>ym(d)>=keys[0]&&ym(d)<=cur,os=db.orders.filter(o=>inP(o.date)),by=(a,f,dt)=>keys.map(k=>a.filter(x=>ym(x[dt])===k).reduce((s,x)=>s+f(x),0));
const S=[['Услуги',svcTotal,COL[0]],['Материалы',matTotal,COL[1]],['Фурнитура',fitTotal,COL[2]],['Изделия',prodTotal,COL[3]]],ser=S.map(([l,f,c])=>({n:l,c,v:by(os,f,'date')})),pays=db.orders.flatMap(o=>o.payments||[]).filter(p=>inP(p.date));
const T=os.reduce((s,o)=>s+total(o),0),P=os.reduce((s,o)=>s+paid(o),0),grp=(a,k,v)=>{const m={};a.forEach(x=>m[k(x)]=(m[k(x)]||0)+v(x));return Object.entries(m).map(([l,v])=>({l,v})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v)};
const cl=grp(os,o=>client(o.clientId).name,total).slice(0,6),sv=grp(os.flatMap(o=>o.services||[]),x=>x.name,x=>x.qty*x.price).slice(0,6),st=grp(os,o=>o.status,()=>1).map(x=>({...x,c:{'Завершён':'#1f8f55','В работе':'#2e6baa','Выдан частично':'#f1c84b','Новый':'#b9382c'}[x.l]})),dbt=db.clients.map(c=>({l:c.name,v:bal(c.id),c:'#b8491d'})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,6);
const K=(l,v)=>`<div class="stat"><div class="l">${l}</div><div class="v">${v}</div></div>`,leg=ser.map(x=>`<span><i style="background:${x.c}"></i>${x.n}</span>`).join('');
document.getElementById('analytics').innerHTML=`<div class="card"><div class="head"><h2>Аналитика</h2><select class="asel" onchange="ap=+this.value;renderAnalytics()">${[[3,'3 месяца'],[6,'6 месяцев'],[12,'12 месяцев'],[0,'Всё время']].map(x=>`<option value="${x[0]}" ${x[0]===ap?'selected':''}>${x[1]}</option>`).join('')}</select></div></div><div class="grid">${K('Оборот',money(T))}${K('Оплачено',money(P))}${K('Долг по заказам',`<span class="${T>P?'debt':'credit'}">${money(Math.max(0,T-P))}</span>`)}${K('Средний чек',money(os.length?T/os.length:0))}</div>
<div class="cols"><div class="card"><h2>Оборот по месяцам</h2><div class="lg" style="margin-bottom:8px">${leg}</div>${stack(lb,ser)}</div><div class="card"><h2>Структура выручки</h2>${donut(S.map(([l,f])=>({l,v:os.reduce((s,o)=>s+f(o),0)})).filter(x=>x.v>0))}</div></div>
<div class="cols"><div class="card"><h2>Оплаты по месяцам</h2>${stack(lb,[{n:'Оплаты',c:COL[0],v:by(pays,p=>p.amount,'date')}])}</div><div class="card"><h2>Заказы по статусам</h2>${hbars(st,x=>x+' шт')}</div></div>
<div class="cols"><div class="card"><h2>Топ клиентов по обороту</h2>${hbars(cl)}</div><div class="card"><h2>Топ услуг по выручке</h2>${hbars(sv)}</div></div><div class="card"><h2>Должники (текущий баланс)</h2>${hbars(dbt)}</div>`}
/* ===== ОБЛАКО (Supabase) ===== */
let sb=null,snap={},st=null,busy=false,again=false,dirty=false,curV='dashboard';
const _view=view;view=function(v){curV=v;return _view(v)};
const TB=['clients','orders','refs','settings'];
function ents(){return{clients:Object.fromEntries(db.clients.map(x=>[x.id,x])),orders:Object.fromEntries(db.orders.map(x=>[x.id,x])),refs:Object.fromEntries(Object.entries(db.refs).flatMap(([k,a])=>a.map(x=>[x.id,{...x,kind:k}]))),settings:{seq:{seq:db.seq}}}}
function mkSnap(){snap=Object.fromEntries(Object.entries(ents()).map(([t,m])=>[t,Object.fromEntries(Object.entries(m).map(([i,v])=>[i,JSON.stringify(v)]))]))}
function setSync(s,m){const e=document.getElementById('sync');if(e){e.textContent=s==='ok'?'✓ Сохранено':s==='err'?'⚠ Ошибка: '+(m||''):'Сохранение…';e.className='badge '+(s==='ok'?'green':s==='err'?'red':'yellow')}}
function queueSync(){dirty=true;setSync('...');clearTimeout(st);st=setTimeout(doSync,400)}
async function doSync(){if(busy){again=true;return}busy=true;try{const cur=ents();for(const t of TB){const up=[],del=[];for(const id in cur[t]){const j=JSON.stringify(cur[t][id]);if(snap[t][id]!==j)up.push({id,data:cur[t][id],j})}for(const id in snap[t])if(!(id in cur[t]))del.push(id);if(up.length){const{error}=await sb.from(t).upsert(up.map(({id,data})=>({id,data})));if(error)throw error;up.forEach(u=>snap[t][u.id]=u.j)}if(del.length){const{error}=await sb.from(t).delete().in('id',del);if(error)throw error;del.forEach(id=>delete snap[t][id])}}dirty=false;setSync('ok')}catch(e){console.error(e);setSync('err',e.message)}busy=false;if(again){again=false;doSync()}}
async function pull(t){let a=[],i=0;for(;;){const{data,error}=await sb.from(t).select('id,data').order('id').range(i,i+999);if(error)throw error;a=a.concat(data);if(data.length<1000)return a;i+=1000}}
async function loadCloud(local){const[c,o,r,s]=await Promise.all(TB.map(pull));let n=null;if(local&&!c.length&&!o.length&&!r.length){const imp=local.clients.length||local.orders.length?confirm(`Облачная база пуста. Загрузить в неё данные из этого браузера (клиентов: ${local.clients.length}, заказов: ${local.orders.length})?`):false;n=imp?local:{seq:0,clients:[],orders:[],refs:local.refs};db=n;snap={clients:{},orders:{},refs:{},settings:{}};queueSync();return}
db={seq:0,clients:c.map(x=>x.data),orders:o.map(x=>x.data),refs:{processes:[],materials:[],fittings:[]}};r.forEach(x=>{const{kind,...d}=x.data;(db.refs[kind]||(db.refs[kind]=[])).push(d)});db.orders.forEach(x=>x.fittings=x.fittings||[]);db.seq=Math.max(s.find(x=>x.id==='seq')?.data.seq||0,...db.orders.map(x=>x.globalNo),0);mkSnap()}
async function boot(){if(!SB_URL||!SB_KEY){view('dashboard');return}
if(!window.supabase){document.body.innerHTML='<p style="padding:20px">Не загрузилась библиотека Supabase. Проверьте интернет и обновите страницу.</p>';return}
document.querySelector('.app').style.visibility='hidden';sb=supabase.createClient(SB_URL,SB_KEY);const{data}=await sb.auth.getSession();data.session?startCloud():loginForm()}
function loginForm(msg=''){modal(`<div style="max-width:380px;margin:auto"><h2>ALIYA ERP — вход</h2>${msg?`<div class="notice" style="margin:10px 0;color:#a63127">${esc(msg)}</div>`:''}<div class="field" style="margin-top:14px"><label>Email</label><input id="lg_e" type="email" autocomplete="username"></div><div class="field" style="margin-top:10px"><label>Пароль</label><input id="lg_p" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div><div class="actions" style="margin-top:15px"><button class="btn primary" style="width:100%" onclick="login()">Войти</button></div></div>`)}
async function login(){const{error}=await sb.auth.signInWithPassword({email:lg_e.value.trim(),password:lg_p.value});if(error)return loginForm('Неверный email или пароль');closeModal();startCloud()}
async function logout(){await sb.auth.signOut();location.reload()}
async function startCloud(){try{await loadCloud(db);cloud=true;syncRefs();const a=document.querySelector('.top .actions');a.insertAdjacentHTML('afterbegin','<span id="sync" class="badge green" style="align-self:center">✓ Сохранено</span>');a.insertAdjacentHTML('beforeend','<button class="btn secondary" onclick="logout()">Выйти</button>');document.querySelector('.app').style.visibility='';view('dashboard')}catch(e){modal(`<h2>Не удалось загрузить данные</h2><div class="notice" style="margin:10px 0">${esc(e.message||e)}<br>Проверьте, что выполнен скрипт supabase.sql.</div><div class="actions"><button class="btn primary" onclick="closeModal();startCloud()">Повторить</button><button class="btn secondary" onclick="logout()">Выйти</button></div>`)}}
async function refresh(){if(!cloud||dirty||busy||curV==='print'||document.getElementById('modal').className!=='hidden')return;try{await loadCloud();syncRefs();if((curV==='client'&&!client(cid))||(curV==='order'&&!db.orders.find(o=>o.id===oid)))curV='dashboard';const y=scrollY;view(curV);scrollTo(0,y)}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});setInterval(refresh,60000);
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
mobLabels();boot();
</script></body></html>
